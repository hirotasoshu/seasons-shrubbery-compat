name: Build release JAR
on:
  release:
    types: [published]
permissions:
  contents: write
concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PYCODE'
          import os, re
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.-]+)?', tag):
              raise SystemExit('Use a version tag such as v0.1.0')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('MOD_VERSION=' + tag[1:] + '\n')
          PYCODE
      - name: Build and run isolated Minecraft integration tests
        run: ./gradlew --no-daemon build integrationCheck "-PmodVersion=$MOD_VERSION"
      - name: Checksum artifacts
        run: |
          cd build/libs
          sha256sum ./*.jar > SHA256SUMS.txt
      - name: Attach JARs to this release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" build/libs/*.jar build/libs/SHA256SUMS.txt --clobber
      - name: Keep integration test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-results
          path: |
            run-integration-test/integration-result.txt
            run-integration-test/logs/latest.log
          if-no-files-found: ignore
